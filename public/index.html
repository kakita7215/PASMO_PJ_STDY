<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ESP32 Alarm Settings</title>

<style>
/* ========= テーマ定義（色のみ） ========= */
:root {
  --bg: #f3f4f6;
  --card: #ffffff;
  --text: #1f2937;
  --subtext: #374151;
  --accent: #4caf50;
  --border: #d1d5db;
}

body.dark {
  --bg: #111827;
  --card: #1f1f29; /*#1f2937*/
  --text: #f9fafb;
  --subtext: #d1d5db;
  --accent: #22c55e;
  --border: #374151;
}

/* ========= レイアウト（既存崩さない） ========= */
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.wrapper {
  max-width: 420px;
  margin: 40px auto;
}

.card {
  background: var(--card);
  border-radius: 12px;
  padding: 28px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

h1 {
  margin: 0 0 16px;
  font-size: 26px;
  text-align: center;
}

.status {
  background: #dcfce7;
  color: #166534;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
  margin-bottom: 20px;
  font-size: 14px;
}

label {
  display: block;
  margin-top: 14px;
  font-size: 14px;
  color: var(--subtext);
}

input[type="time"] {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 26px;
  /*font-weight: 600;*/
}

input[type="number"] {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  box-sizing: border-box;
}

.checkbox {
  margin-top: 14px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}

/* ========= テーマ切替UI ========= */
.theme {
  margin-bottom: 12px;
  font-size: 14px;
}
</style>

<script>
/* HTML内だけで完結（index.js変更なし） */
function setTheme(mode) {
  document.body.classList.toggle("dark", mode === "dark");
}
</script>
</head>

<body>
<div class="wrapper">

  <div class="theme">
    <label>
      <input type="radio" name="theme" checked onclick="setTheme('light')">
      Light
    </label>
    <label>
      <input type="radio" name="theme" onclick="setTheme('dark')">
      Dark
    </label>
  </div>

  <div class="card">
    <h1>🔔 ESP32 Alarm</h1>

    <div class="status">✓ サーバーに接続中</div>
    <br>
    <div style="text-align: center; margin-bottom: 20px;">
      <div style="font-size: 14px; color: var(--subtext); margin-bottom: 8px;">次回アラーム時刻</div>
      <div id="nextAlarmTime" style="font-size: 36px; font-weight: 300; letter-spacing: 2px;">--:--</div>
    </div>
    <label>アラーム時刻</label>
    <input type="time" id="alarmTime">
    <br>
    <div class="checkbox">
      <label>
        <input type="checkbox" id="alarmEnable">
        アラームを有効にする
      </label>
    </div>
    <br>
    <label>スヌーズ間隔（分）</label>
      <input type="number" id="snoozeInterval" min="1" max="60" value="5">
    <br>
    <label>スヌーズ回数</label>
      <input type="number" id="snoozeCount" min="1" max="10" value="3">
    <br>
    <label class="checkbox">
      <input type="checkbox" id="snoozeEnable">
      スヌーズを有効にする
    </label>

    <br>
    <button onclick="sendAlarm()">設定を送信</button>
    <button id="stopButton" onclick="stopAlarm()" style="background: #ef4444; margin-top: 10px;" disabled>アラームを停止</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
