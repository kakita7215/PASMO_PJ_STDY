<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Alarm v27.04</title>

<style>
/* ========= テーマ定義（色のみ） ========= */
:root {
  --bg: #f3f4f6;
  --card: #ffffff;
  --text: #1f2937;
  --subtext: #374151;
  --accent: #4caf50;
  --border: #d1d5db;
}

body.dark {
  --bg: #111827;
  --card: #1f1f29;
  --text: #f9fafb;
  --subtext: #d1d5db;
  --accent: #22c55e;
  --border: #374151;
}

/* ========= レイアウト ========= */
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.wrapper {
  max-width: 420px;
  margin: 40px auto;
  padding: 0 20px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.status-group {
  display: flex;
  gap: 8px;
}

.status-pill {
  background: #dcfce7;
  color: #166534;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  line-height: 1;
}

.status-pill.disconnected {
  background: #fee2e2;
  color: #991b1b;
}

.theme {
  display: flex;
  justify-content: flex-end; /* 右寄せ */
  gap: 12px;
}


.card {
  background: var(--card);
  border-radius: 12px;
  padding: 28px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

h1 {
  margin: 0 0 16px;
  font-size: 26px;
  text-align: center;
}


label {
  display: block;
  margin-top: 14px;
  font-size: 14px;
  color: var(--subtext);
}

input[type="time"] {
  width: 100%;
  padding: 10px;
  font-size: 26px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  box-sizing: border-box;
}

input[type="number"] {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  box-sizing: border-box;
}

.checkbox {
  margin-top: 14px;
}

.section-divider {
  height: 0;
  border: none;
  border-top: 1px solid var(--border);
  margin: 18px 0 12px;
}

.day-grid {
  display: grid;
  grid-template-columns: max-content max-content repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--subtext);
}

.day-grid label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 0;
  white-space: normal;
}

.day-grid .day-wide {
  white-space: nowrap;
}

.day-grid .day-nowrap {
  white-space: nowrap;
}

.day-grid .day-spacer { visibility: hidden; }

button {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  transition: opacity 0.2s;
}

button:hover:not(:disabled) {
  opacity: 0.9;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
/* ========= テーマ切替UI ========= */
.theme {
  margin-bottom: 12px;
  font-size: 14px;
}
</style>

<script>
function setTheme(mode) {
  document.body.classList.toggle("dark", mode === "dark");
}
</script>
</head>

<body>
<div class="wrapper">

  <div class="card">

    <div class="topbar">
      <div class="status-group">
        <div class="status-pill disconnected" id="statusClient">HTML: 未接続</div>
        <div class="status-pill disconnected" id="statusEsp32">ESP32: 未接続</div>
      </div>
      <div class="theme">
        <label>
          <input type="radio" name="theme" checked onclick="setTheme('light')">
          Light
        </label>
        <label>
          <input type="radio" name="theme" onclick="setTheme('dark')">
          Dark
        </label>
      </div>
    </div>

    <h1>🔔 ESP32 Alarm</h1>
    <div id="currentTime" style="font-size: 56px; font-weight: 600; text-align: center; letter-spacing: 2px; margin: 6px 0 18px;">--:--</div>
    
    <div style="text-align: center; margin-bottom: 20px;">
      <div style="font-size: 14px; color: var(--subtext); margin-bottom: 8px;">設定アラーム時刻</div>
      <div id="nextAlarmTime" style="font-size: 36px; font-weight: 300; letter-spacing: 2px;">--:--</div>
    </div>
    
    <label>
      <input type="checkbox" id="alarmEnable" style="margin-left: 10px;">
      <span style="font-weight: 400; font-size: 13px; color: var(--subtext);">アラームを有効にする</span>
    </label>
    <input type="time" id="alarmTime">

    <label>アラーム曜日</label>
    <div class="day-grid" id="alarmDays">
      <label class="day-nowrap"><input type="checkbox" id="alarmEveryday">毎日</label>
      <label class="day-wide"><input type="checkbox" id="alarmWeekdays">平日 (土日祝を除く)</label>
      <span class="day-spacer"></span>
      <span class="day-spacer"></span>
      <span class="day-spacer"></span>
      <span class="day-spacer"></span>
      <span class="day-spacer"></span>
      <label><input type="checkbox" data-day="mon">月</label>
      <label><input type="checkbox" data-day="tue">火</label>
      <label><input type="checkbox" data-day="wed">水</label>
      <label><input type="checkbox" data-day="thu">木</label>
      <label><input type="checkbox" data-day="fri">金</label>
      <label><input type="checkbox" data-day="sat">土</label>
      <label><input type="checkbox" data-day="sun">日</label>
    </div>

    <hr class="section-divider">

    <label class="checkbox">
      <input type="checkbox" id="snoozeEnable">
      スヌーズを有効にする
    </label>

    <label>スヌーズ間隔（分）</label>
    <input type="number" id="snoozeInterval" min="1" max="60" value="5">

    <label>スヌーズ回数</label>
    <input type="number" id="snoozeCount" min="1" max="10" value="3">
    
    <button onclick="sendAlarm()">設定を送信</button>
    <button onclick="sendTimeSync()">時刻同期</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
